! FSW-F5: Floor 5 access switch, 24-port PoE+ (370 W), 2x SFP+ uplinks
! Cisco IOS-style. Secrets are placeholders.
hostname FSW-F5
service password-encryption
enable secret <REDACTED>
username admin privilege 15 secret <REDACTED>
spanning-tree mode rapid-pvst
spanning-tree portfast bpduguard default
!
vlan 10
 name MGMT
vlan 40
 name ACS-DOOR
vlan 41
 name ACS-ELEV
vlan 70
 name CCTV
vlan 105
 name RES-F5
vlan 999
 name BLACKHOLE
!
ip dhcp snooping
ip dhcp snooping vlan 105
no ip dhcp snooping information option
ip arp inspection vlan 105
!
interface Vlan10
 ip address 10.20.10.25 255.255.255.0
ip default-gateway 10.20.10.1
!
! ---- Uplinks: one 10G link to each distribution stack member ----
interface range Te1/1/1 - 2
 description TO-DS-STACK
 switchport mode trunk
 channel-group 1 mode active
interface Port-channel1
 description LAG-DS-STACK
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,40,41,70,105
 ip dhcp snooping trust
 ip arp inspection trust
!
interface range Gi1/0/1 - 2
 description WIFI6-AP
 switchport mode trunk
 switchport trunk native vlan 10
 switchport trunk allowed vlan 10,105
 power inline auto
 spanning-tree portfast trunk
 ip dhcp snooping limit rate 30
!
interface range Gi1/0/3
 description DOOR-CONTROLLER
 switchport mode access
 switchport access vlan 40
 spanning-tree portfast
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation shutdown
 power inline auto
!
interface range Gi1/0/4
 description ELEVATOR-CONTROLLER
 switchport mode access
 switchport access vlan 41
 spanning-tree portfast
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation shutdown
 power inline auto
!
interface range Gi1/0/5 - 6
 description IP-CAMERA
 switchport mode access
 switchport access vlan 70
 spanning-tree portfast
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation shutdown
 power inline auto
!
interface range Gi1/0/7 - 10
 description UNIT-OUTLETS
 switchport mode access
 switchport access vlan 105
 spanning-tree portfast
 switchport protected
 switchport port-security
 switchport port-security maximum 3
 switchport port-security violation restrict
 ip dhcp snooping limit rate 20
 storm-control broadcast level 5.00
 storm-control multicast level 10.00
!
! ---- Unused ports disabled ----
interface range Gi1/0/11 - 24
 switchport mode access
 switchport access vlan 999
 shutdown
 power inline never
!
ip ssh version 2
ip access-list standard MGMT-SSH
 permit host 10.20.10.50
line vty 0 15
 transport input ssh
 access-class MGMT-SSH in
 login local
 exec-timeout 10 0
banner motd ^Authorized access only. Activity is logged.^
snmp-server group NMS v3 priv
snmp-server user nms NMS v3 auth sha <REDACTED> priv aes 128 <REDACTED>
ntp server 10.20.10.30
logging host 10.20.10.30

end
