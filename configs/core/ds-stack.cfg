! DS-STACK (configs/core/ds-stack.cfg): DS-1 + DS-2, 2x 32-port L3 managed switches in a stack (or MLAG pair)
! Cisco IOS-style. Secrets are placeholders. Interface names: Te<member>/0/<port>.
hostname DS-STACK
switch 1 priority 15
switch 2 priority 14
ip routing
service password-encryption
no ip http server
no ip http secure-server
ip domain-name example.local
enable secret <REDACTED>
username admin privilege 15 secret <REDACTED>
spanning-tree mode rapid-pvst
spanning-tree vlan 1-4094 priority 4096
!
vlan 2
 name TRANSIT
vlan 10
 name MGMT
vlan 20
 name ENT-USERS
vlan 25
 name ENT-SERVERS
vlan 30
 name ENT-PRINTERS
vlan 40
 name ACS-DOOR
vlan 41
 name ACS-ELEV
vlan 50
 name WIFI-ENT
vlan 60
 name GUEST
vlan 70
 name CCTV
vlan 103
 name RES-F3
vlan 104
 name RES-F4
vlan 105
 name RES-F5
vlan 106
 name RES-F6
vlan 107
 name RES-F7
vlan 108
 name RES-F8
vlan 999
 name BLACKHOLE
!
! ---- Firewall pair: FW-A to DS-1, FW-B to DS-2 (trunk: VLAN 2 transit + VLAN 70 CCTV) ----
interface range Te1/0/13 , Te2/0/13
 description FIREWALL-HA-PAIR
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 2,70
 spanning-tree portfast trunk
!
! ---- Floor uplinks: one 10G link to each stack member, one LACP bundle per floor ----
interface range Te1/0/1 , Te2/0/1
 description TO-FSW-F1
 switchport mode trunk
 channel-group 11 mode active
interface Port-channel11
 description LAG-FSW-F1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,41,50,60,70
!
interface range Te1/0/2 , Te2/0/2
 description TO-FSW-F2
 switchport mode trunk
 channel-group 12 mode active
interface Port-channel12
 description LAG-FSW-F2
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,41,50,70
!
interface range Te1/0/3 , Te2/0/3
 description TO-FSW-F3
 switchport mode trunk
 channel-group 13 mode active
interface Port-channel13
 description LAG-FSW-F3
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,40,41,70,103
!
interface range Te1/0/4 , Te2/0/4
 description TO-FSW-F4
 switchport mode trunk
 channel-group 14 mode active
interface Port-channel14
 description LAG-FSW-F4
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,40,41,70,104
!
interface range Te1/0/5 , Te2/0/5
 description TO-FSW-F5
 switchport mode trunk
 channel-group 15 mode active
interface Port-channel15
 description LAG-FSW-F5
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,40,41,70,105
!
interface range Te1/0/6 , Te2/0/6
 description TO-FSW-F6
 switchport mode trunk
 channel-group 16 mode active
interface Port-channel16
 description LAG-FSW-F6
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,40,41,70,106
!
interface range Te1/0/7 , Te2/0/7
 description TO-FSW-F7
 switchport mode trunk
 channel-group 17 mode active
interface Port-channel17
 description LAG-FSW-F7
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,40,41,70,107
!
interface range Te1/0/8 , Te2/0/8
 description TO-FSW-F8
 switchport mode trunk
 channel-group 18 mode active
interface Port-channel18
 description LAG-FSW-F8
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,40,41,70,108
!
! ---- Server blocks: dual-homed, one 10G link per stack member ----
interface range Te1/0/9 , Te2/0/9
 description ENT-SERVERS (2xDC, file, print, RADIUS)
 channel-group 20 mode active
interface Port-channel20
 description ENT-SERVERS (2xDC, file, print, RADIUS)
 switchport mode access
 switchport access vlan 25
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface range Te1/0/10 , Te2/0/10
 description MGMT (jump host, NMS, AP controller)
 channel-group 21 mode active
interface Port-channel21
 description MGMT (jump host, NMS, AP controller)
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface range Te1/0/11 , Te2/0/11
 description ACS-SERVERS (door + elevator)
 channel-group 22 mode active
interface Port-channel22
 description ACS-SERVERS (door + elevator)
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 40,41
!
interface range Te1/0/12 , Te2/0/12
 description NVR
 channel-group 23 mode active
interface Port-channel23
 description NVR
 switchport mode access
 switchport access vlan 70
 spanning-tree portfast
 spanning-tree bpduguard enable
!
! ---- Unused ports ----
interface range Te1/0/14 - 32 , Te2/0/14 - 32
 switchport mode access
 switchport access vlan 999
 shutdown
!
! ---- Transit to firewall pair (VRRP/CARP VIP 10.20.0.1) ----
interface Vlan2
 description TRANSIT-FW
 ip address 10.20.0.4 255.255.255.248
ip route 0.0.0.0 0.0.0.0 10.20.0.1
!
! ---- SVIs. VLAN 40/41 (ACS) and VLAN 70 (CCTV) have NO SVI here: VLAN 70 is routed by the firewall; ACS is not routed ----
interface Vlan10
 description MGMT
 ip address 10.20.10.1 255.255.255.0
interface Vlan20
 description ENT-USERS
 ip address 10.20.20.1 255.255.255.0
 ip helper-address 10.20.25.10
 ip helper-address 10.20.25.11
 ip access-group ENT-IN in
interface Vlan25
 description ENT-SERVERS
 ip address 10.20.25.1 255.255.255.0
interface Vlan30
 description ENT-PRINTERS
 ip address 10.20.30.1 255.255.255.0
interface Vlan50
 description WIFI-ENT
 ip address 10.20.50.1 255.255.255.0
 ip helper-address 10.20.25.10
 ip helper-address 10.20.25.11
 ip access-group ENT-IN in
interface Vlan60
 description GUEST
 ip address 10.20.60.1 255.255.255.0
 ip access-group GUEST-IN in
interface Vlan103
 description RES-F3
 ip address 10.20.103.1 255.255.255.0
 ip access-group RES-IN in
interface Vlan104
 description RES-F4
 ip address 10.20.104.1 255.255.255.0
 ip access-group RES-IN in
interface Vlan105
 description RES-F5
 ip address 10.20.105.1 255.255.255.0
 ip access-group RES-IN in
interface Vlan106
 description RES-F6
 ip address 10.20.106.1 255.255.255.0
 ip access-group RES-IN in
interface Vlan107
 description RES-F7
 ip address 10.20.107.1 255.255.255.0
 ip access-group RES-IN in
interface Vlan108
 description RES-F8
 ip address 10.20.108.1 255.255.255.0
 ip access-group RES-IN in
!
! ---- DHCP: guest + residence floors here, enterprise via the DCs ----
ip dhcp excluded-address 10.20.60.1 10.20.60.9
ip dhcp pool GUEST
 network 10.20.60.0 255.255.255.0
 default-router 10.20.60.1
 dns-server 1.1.1.1 9.9.9.9
 lease 0 8
ip dhcp excluded-address 10.20.103.1 10.20.103.9
ip dhcp pool RES-F3
 network 10.20.103.0 255.255.255.0
 default-router 10.20.103.1
 dns-server 1.1.1.1 9.9.9.9
 lease 7
ip dhcp excluded-address 10.20.104.1 10.20.104.9
ip dhcp pool RES-F4
 network 10.20.104.0 255.255.255.0
 default-router 10.20.104.1
 dns-server 1.1.1.1 9.9.9.9
 lease 7
ip dhcp excluded-address 10.20.105.1 10.20.105.9
ip dhcp pool RES-F5
 network 10.20.105.0 255.255.255.0
 default-router 10.20.105.1
 dns-server 1.1.1.1 9.9.9.9
 lease 7
ip dhcp excluded-address 10.20.106.1 10.20.106.9
ip dhcp pool RES-F6
 network 10.20.106.0 255.255.255.0
 default-router 10.20.106.1
 dns-server 1.1.1.1 9.9.9.9
 lease 7
ip dhcp excluded-address 10.20.107.1 10.20.107.9
ip dhcp pool RES-F7
 network 10.20.107.0 255.255.255.0
 default-router 10.20.107.1
 dns-server 1.1.1.1 9.9.9.9
 lease 7
ip dhcp excluded-address 10.20.108.1 10.20.108.9
ip dhcp pool RES-F8
 network 10.20.108.0 255.255.255.0
 default-router 10.20.108.1
 dns-server 1.1.1.1 9.9.9.9
 lease 7
!
! ---- ACLs (coarse, stateless; stateful rules for server access are optional on the firewall) ----
ip access-list extended RES-IN
 permit udp any eq bootpc any eq bootps
 permit tcp any 10.20.200.0 0.0.0.255 eq 25
 permit tcp any 10.20.200.0 0.0.0.255 eq 80
 permit tcp any 10.20.200.0 0.0.0.255 eq 443
 permit tcp any 10.20.200.0 0.0.0.255 eq 587
 permit tcp any 10.20.200.0 0.0.0.255 eq 993
 deny   ip any 10.20.0.0 0.0.255.255
 permit ip any any
ip access-list extended GUEST-IN
 permit udp any eq bootpc any eq bootps
 deny   ip any 10.20.0.0 0.0.255.255
 permit ip any any
ip access-list extended ENT-IN
 permit udp any eq bootpc any eq bootps
 deny   ip any 10.20.10.0 0.0.0.255
 deny   ip any 10.20.40.0 0.0.1.255
 deny   ip any 10.20.60.0 0.0.0.255
 deny   ip any 10.20.70.0 0.0.0.255
 deny   ip any 10.20.100.0 0.0.7.255
 deny   ip any 10.20.108.0 0.0.0.255
 permit ip any any
!
! ---- Management ----
ip ssh version 2
ip access-list standard MGMT-SSH
 permit host 10.20.10.50
line vty 0 15
 transport input ssh
 access-class MGMT-SSH in
 login local
 exec-timeout 10 0
banner motd ^Authorized access only. Activity is logged.^
snmp-server group NMS v3 priv
snmp-server user nms NMS v3 auth sha <REDACTED> priv aes 128 <REDACTED>
ntp server 10.20.10.30
logging host 10.20.10.30

end
